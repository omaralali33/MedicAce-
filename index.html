<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#0a0e1a!important;color:#e8eaf6;font-family:'Nunito',sans-serif;min-height:100vh;}
#app{max-width:900px;margin:0 auto;padding:16px 16px 60px;}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#111827;border-radius:16px;margin-bottom:18px;border:1px solid rgba(0,210,255,0.15);position:relative;overflow:hidden;}
.hdr::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#00d2ff,transparent);}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px;}
@media(min-width:500px){.nav{grid-template-columns:repeat(5,1fr);}}
@media(min-width:720px){.nav{grid-template-columns:repeat(9,1fr);}}
.nc{background:#111827;border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:10px 6px;cursor:pointer;text-align:center;transition:all 0.2s;}
.nc.on{border-color:#00d2ff;box-shadow:0 0 18px rgba(0,210,255,0.2);}
.panel{background:#111827;border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:20px;animation:fi 0.3s ease;}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:#1a2235;border:1px solid rgba(255,255,255,0.06);border-radius:11px;padding:14px;cursor:pointer;transition:all 0.2s;}
.card:hover{transform:translateY(-2px);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px;}
@media(max-width:480px){.g2{grid-template-columns:1fr;}}
.btn{background:#00d2ff;color:#000;border:none;padding:11px;border-radius:99px;font-family:'Oxanium',monospace;font-size:13px;font-weight:800;cursor:pointer;width:100%;margin-top:10px;}
.bk{background:transparent;border:1px solid rgba(255,255,255,0.1);color:#8892b0;padding:6px 14px;border-radius:99px;cursor:pointer;font-size:11px;font-weight:700;margin-bottom:13px;}
.tab{padding:6px 14px;border-radius:99px;border:1px solid rgba(255,255,255,0.1);cursor:pointer;font-size:11px;font-weight:700;font-family:'Oxanium',monospace;background:#1a2235;color:#8892b0;}
.tab.on{background:#00d2ff;color:#000;border-color:#00d2ff;}
.ob{background:#111827;border:1px solid rgba(255,255,255,0.1);color:#e8eaf6;padding:10px 13px;border-radius:9px;cursor:pointer;text-align:left;font-size:13px;font-weight:600;display:flex;align-items:center;gap:9px;width:100%;margin-bottom:8px;}
.ob:hover:not([disabled]){border-color:#00d2ff;background:rgba(0,210,255,0.08);}
.ob.ok{background:rgba(46,213,115,0.15)!important;border-color:#2ed573!important;color:#2ed573!important;}
.ob.er{background:rgba(255,71,87,0.15)!important;border-color:#ff4757!important;color:#ff4757!important;}
.ol{width:24px;height:24px;border-radius:50%;background:#1a2235;display:flex;align-items:center;justify-content:center;font-family:'Oxanium',monospace;font-size:10px;font-weight:700;flex-shrink:0;}
.expl{background:rgba(46,213,115,0.08);border:1px solid rgba(46,213,115,0.3);border-radius:9px;padding:11px;margin-top:10px;font-size:12px;line-height:1.6;}
.pb{height:5px;background:#1a2235;border-radius:99px;overflow:hidden;margin-bottom:12px;}
.pf{height:100%;background:#00d2ff;border-radius:99px;transition:width 0.4s;}
.vc{background:#111827;border-radius:7px;padding:6px 8px;text-align:center;border:1px solid rgba(255,255,255,0.06);}
.sc{background:#1a2235;border-radius:11px;padding:13px 16px;cursor:pointer;margin-bottom:10px;border-left:3px solid transparent;}
.sc .sb{display:none;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.06);}
.sc.op .sb{display:block;}
.ai{display:block;width:100%;background:#1a2235;border:1px solid rgba(255,255,255,0.12);color:#e8eaf6;padding:13px 16px;border-radius:12px;font-size:14px;font-family:'Nunito',sans-serif;outline:none;margin-bottom:12px;}
.ai:focus{border-color:#00d2ff;}
.mu{color:#8892b0;font-size:12px;}
.pt{font-family:'Oxanium',monospace;font-size:18px;font-weight:800;margin-bottom:10px;}
</style>
</head>

id:5,title:“Diabetic Emergency”,emoji:“🍬”,difficulty:“Easy”,xp:55,

},
{

{
id:9,title:“Burns & Inhalation Injury”,emoji:“🔥”,difficulty:“Hard”,xp:110,

function bindAuth(){
document.getElementById(“btnLogin”)?.addEventListener(“click”,()=>set({aMode:“login”,aErr:””}));
document.getElementById(“btnReg”)?.addEventListener(“click”,()=>set({aMode:“reg”,aErr:””}));
document.getElementById(“btnSubmit”)?.addEventListener(“click”,doAuth);
document.getElementById(“inPass”)?.addEventListener(“keydown”,e=>{if(e.key===“Enter”)doAuth();});
}

async function doAuth(){
const email=(document.getElementById(“inEmail”)?.value||””).trim().toLowerCase();
const pass=document.getElementById(“inPass”)?.value||””;
const name=document.getElementById(“inName”)?.value||””;
if(!email||!pass){set({aErr:“Fill in all fields.”});return;}
if(pass.length<6){set({aErr:“Password needs 6+ characters.”});return;}
set({aLoading:true,aErr:””});
try{
let res,u;
if(S.aMode===“login”){
res=await signIn(email,pass);
if(res.error){set({aLoading:false,aErr:res.error.message||“Login failed.”});return;}
const p=await getProfile(res.user.id,res.access_token);
u={id:res.user.id,email,tok:res.access_token,name:p?.name||email.split(”@”)[0],color:p?.avatar_color||”#00d2ff”};
S.xp=p?.xp||0; S.done=p?.completed_scenarios||[];
}else{
if(!name){set({aLoading:false,aErr:“Enter your name.”});return;}
res=await signUp(email,pass,name);
if(res.error){set({aLoading:false,aErr:res.error.message||“Sign up failed.”});return;}
const cols=[”#ff4757”,”#ffa502”,”#2ed573”,”#1e90ff”,”#a29bfe”,”#fd79a8”];
const color=cols[Math.floor(Math.random()*cols.length)];
const tok=res.session?.access_token;
if(!tok){set({aLoading:false,aErr:“Check your email to confirm, then sign in.”,aMode:“login”});return;}
u={id:res.user.id,email,tok,name,color};
await saveProfile(u.id,u.tok,{name,avatar_color:color,xp:0,completed_scenarios:[]});
S.xp=0; S.done=[];
}
localStorage.setItem(“ma”,JSON.stringify(u));
set({page:“app”,user:u,aLoading:false,tab:“home”});
}catch(e){set({aLoading:false,aErr:“Network error. Try again.”});}
}

function doLogout(){
localStorage.removeItem(“ma”);
set({page:“auth”,user:null,xp:0,done:[],tab:“home”});
}

// ── TIPS ──────────────────────────────────────────────────────────────────────
const TIPS2=[
{t:“AMS - The 4 S’s”,i:“🧠”,c:”#a29bfe”,b:“Sugar (BGL first), Stroke (FAST), Seizures (check meds), Sepsis (infection signs). If not 4Ss → NOT: Narcan, Oxygen, Trauma.\n⭐ BGL first — hypoglycemia is most reversible.”},
{t:“Sick Child Signs”,i:“👶”,c:”#2ed573”,b:“Eye contact — tracking you? Tone — limp/lethargic = red flag. Work of breathing + skin color.\n⭐ A child that does not notice you and lets you assess = VERY sick.”},
{t:“CHF vs Pneumonia”,i:“🫁”,c:”#74b9ff”,b:“CHF: bilateral wet crackles, hypertension, JVD, leg edema, pink frothy sputum, acute onset.\nPneumonia: fever, chills, productive cough, gradual.\n⭐ CHF = cardiac history. Pneumonia = infection history.”},
{t:“Hs and Ts”,i:“💔”,c:”#ff4757”,b:“Hs in pairs: Hypoxia+Hypovolemia, H-ion+HyperK/HypoK, Hypothermia alone.\nTs: Tension PTX, Tamponade (trauma causes both), Toxins, Thrombosis (PE/MI).\n⭐ Trauma causes 2 of the Ts.”},
{t:“Types of Shock”,i:“📉”,c:”#fd79a8”,b:“Cardiogenic (MI), Obstructive (Tension PTX/PE/Tamponade), Distributive (Neurogenic/Septic/Anaphylactic), Hypovolemic.\n⭐ Distributive = massive vasodilation = low diastolic BP.”},
{t:“Drug Mechanism Trick”,i:“💊”,c:”#6c5ce7”,b:“Learn MECHANISM first — everything else follows.\nEpinephrine: Alpha1→vasoconstriction, Beta1→HR+contractility, Beta2→bronchodilation.\nDerive: indications, contraindications, side effects from mechanism alone.\n⭐ Mechanism + dose = all you need.”},
];

// ── EXAMS ─────────────────────────────────────────────────────────────────────
const TCA=[
{ph:“SCENE”,c:”#e8304a”,t:“Scene Safety”,b:“PPE on. Mechanism noted. Visible catastrophic bleed → Tourniquet FIRST. Call: ‘Hello, can you hear me?’”},
{ph:“CONFIRM”,c:”#f07d2a”,t:“Confirm Arrest”,b:“No chest movement + no breathing + no carotid pulse (max 10s) = confirmed arrest.”},
{ph:“AIRWAY”,c:”#f5c842”,t:“Clear & iGel”,b:“Open airway. Vomit → suction. Insert iGel (size by weight/colour). BVM + O2. Do NOT start CPR yet.”},
{ph:“BREATHING”,c:”#f5c842”,t:“Check Ventilation”,b:“2 BVM breaths. Both sides rising? One side only → suspect tension PTX. Auscultate. Percuss.”},
{ph:“TENSION PTX”,c:”#f07d2a”,t:“Needle Decompression”,b:“2nd ICS, MCL. Needle in → air rush. Open wound → 3-sided dressing instead.”},
{ph:“HAEMORRHAGE”,c:”#e8304a”,t:“Control Bleeding”,b:“Tourniquet if not applied. Pelvis: compress ONCE only. Unstable → pelvic binder at greater trochanters.”},
{ph:“CPR”,c:”#3a8ef6”,t:“CPR + Monitor”,b:“30:2 compressions. Pads on. Rhythm check every 2 min. IV access — don’t stop CPR for it.”},
{ph:“DRUGS”,c:”#9b6cf7”,t:“Adrenaline”,b:“PEA/Asystole: 1mg IV ASAP. VF/pVT: 1mg after 2nd shock. Flush 20mL NS. Repeat every 3-5 min.\nAmiodarone (VF/pVT only): 300mg after 3rd shock, 150mg after 5th.”},
{ph:“4H/4T”,c:”#22d4e8”,t:“Reversible Causes”,b:“Pupils, BGL, temp, IV fluids for hypovolaemia. Tension PTX already treated.”},
{ph:“POST-ROSC”,c:”#2ecc8a”,t:“ROSC Care”,b:“Signs of life → stop CPR. A: leave iGel unless rejected. B: ventilate if not breathing. C: BP, ECG, fluids. D: GCS, pupils, BGL. E: re-check bleeding → TRANSPORT.”},
];

const NOTES=[
{topic:“💊 Pain Management”,c:”#ffa502”,pts:[“Multimodal = 2+ drugs with DIFFERENT mechanisms”,“KETAMINE: NMDA blocker, 1mg/kg IV, preserves airway”,“PROPOFOL: NO analgesia, causes hypotension”,“ETOMIDATE: haemodynamically stable, NO analgesia”,“MIDAZOLAM: anxiolysis + amnesia (benzodiazepine)”]},
{topic:“🧪 Toxidromes”,c:”#ff4757”,pts:[“STIMULANT: HR/BP/temp↑, dilated pupils → Midazolam”,“OPIOID: RR/GCS↓, PINPOINT pupils → airway first, then Naloxone”,“CHOLINERGIC (DUMBELS): wet patient → Atropine”,“ANTICHOLINERGIC: dry/mad hatter → supportive only”,“NEVER beta-blockers in stimulant toxicity”,“Re-narcotisation: naloxone wears off → repeat dose”]},
{topic:“🌙 Nightclub Scenario”,c:”#6c5ce7”,pts:[“Pt 1 (Opioid): BVM first → naloxone → re-narcotises → repeat”,“Pt 2 (Stimulant): Midazolam, NO beta-blockers → VT → more midazolam”,“Pt 3 (Benzo): Recovery position + suction → STAYS STABLE”,“KEY EXAM POINT: Pts 1 & 2 deteriorate. Pt 3 stable.”]},
];

function exHTML(){
if(S.exTab===“tca”){
return `<div class="pt">🚨 Traumatic Cardiac Arrest</div> <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:18px"> ${[{l:"H",lb:"Hemorrhage",s:"Tourniquet/Binder",c:"#e8304a"},{l:"O",lb:"Oxygenation",s:"Airway/iGel/BVM",c:"#f07d2a"},{l:"T",lb:"Tension PTX",s:"Needle Decomp",c:"#f5c842"}].map(h=>`<div style="background:#1a2235;border:1px solid ${h.c}44;border-radius:11px;padding:12px 8px;text-align:center"><div style="font-family:'Oxanium',monospace;font-size:32px;font-weight:800;color:${h.c}">${h.l}</div><div style="font-size:11px;font-weight:700;margin-bottom:2px">${h.lb}</div><div class="mu" style="font-size:9px">${h.s}</div></div>`).join("")} </div> <button class="tab on" id="exQuiz" style="margin-right:8px;margin-bottom:14px">← Back to Exam</button> ${TCA.map((s,i)=>`<div class=“sc${S.tcaOpen===i?” op”:””}” data-tca=”${i}” style=“border-left-color:${S.tcaOpen===i?s.c:“transparent”}”>
<div style="display:flex;align-items:center;gap:8px">
<div style="width:24px;height:24px;border-radius:50%;background:${s.c}22;border:1.5px solid ${s.c};display:flex;align-items:center;justify-content:center;font-family:'Oxanium',monospace;font-weight:800;font-size:10px;color:${s.c};flex-shrink:0">${i+1}</div>
<span style="font-size:8px;background:${s.c}18;border:1px solid ${s.c}44;border-radius:4px;padding:2px 7px;color:${s.c};font-family:'Oxanium',monospace;letter-spacing:1px">${s.ph}</span>

</div>`).join("")}`;

// ── BIND EVENTS ───────────────────────────────────────────────────────────────
function bindApp(){
document.querySelectorAll(”[data-tab]”).forEach(el=>el.addEventListener(“click”,()=>set({tab:el.dataset.tab,sc:null,scDone:false,prOpen:null,drOpen:null,itOpen:null,tipOpen:null})));
document.getElementById(“avBtn”)?.addEventListener(“click”,()=>{if(confirm(“Sign out?”))doLogout();});
document.getElementById(“btnOut”)?.addEventListener(“click”,doLogout);

// Scenarios
document.querySelectorAll(”.sc-start”).forEach(el=>el.addEventListener(“click”,()=>{
const sc=SCENARIOS.find(s=>s.id===parseInt(el.dataset.id));
set({sc,scStep:0,scAns:null,scScore:0,scDone:false});
}));
document.getElementById(“scBack”)?.addEventListener(“click”,()=>set({sc:null,scDone:false}));
document.querySelectorAll(”.sc-opt”).forEach(btn=>btn.addEventListener(“click”,()=>{
if(S.scAns!==null)return;
const i=parseInt(btn.dataset.i);
if(i===S.sc.steps[S.scStep].correct)S.scScore++;
set({scAns:i});
}));
document.getElementById(“scNext”)?.addEventListener(“click”,()=>{
if(S.scStep+1>=S.sc.steps.length){
addXP(Math.round(S.sc.xp*(S.scScore/S.sc.steps.length)));
const done=S.done.includes(S.sc.id)?S.done:[…S.done,S.sc.id];
S.done=done;
set({scDone:true});
}else set({scStep:S.scStep+1,scAns:null});
});

// Terminology
document.querySelectorAll(”[data-tm]”).forEach(el=>el.addEventListener(“click”,()=>{
const m=el.dataset.tm;
if(m===“quiz”)mkTermQ();
set({tMode:m,tFlip:false,tIdx:0,tAns:null});
}));
document.getElementById(“tCat”)?.addEventListener(“change”,e=>{S.tFilter=e.target.value;S.tIdx=0;S.tFlip=false;if(S.tMode===“quiz”)mkTermQ();draw();});
document.getElementById(“tCard”)?.addEventListener(“click”,()=>set({tFlip:!S.tFlip}));
document.getElementById(“tPrev”)?.addEventListener(“click”,()=>{const l=S.tFilter&&S.tFilter!==“All”?TERMS.filter(t=>t.category===S.tFilter):TERMS;set({tIdx:(S.tIdx-1+l.length)%l.length,tFlip:false});});
document.getElementById(“tNext”)?.addEventListener(“click”,()=>{const l=S.tFilter&&S.tFilter!==“All”?TERMS.filter(t=>t.category===S.tFilter):TERMS;set({tIdx:(S.tIdx+1)%l.length,tFlip:false});});
document.getElementById(“tQStart”)?.addEventListener(“click”,()=>{mkTermQ();draw();});
document.querySelectorAll(”.tOpt”).forEach(btn=>btn.addEventListener(“click”,()=>{
if(S.tAns!==null)return;
const v=decodeURIComponent(btn.dataset.tv);
const ok=v===S.tQ.def;
if(ok)addXP(5);
S.tScore+=ok?1:0; S.tTotal++;
set({tAns:v});
}));
document.getElementById(“tNext2”)?.addEventListener(“click”,()=>{mkTermQ();set({tAns:null});});

// Protocols
document.querySelectorAll(”[data-pr]”).forEach(el=>el.addEventListener(“click”,()=>{const i=parseInt(el.dataset.pr);set({prOpen:S.prOpen===i?null:i});}));
// Drugs
document.querySelectorAll(”[data-dr]”).forEach(el=>el.addEventListener(“click”,()=>{const i=parseInt(el.dataset.dr);set({drOpen:S.drOpen===i?null:i});}));
// Intubation
document.querySelectorAll(”[data-it]”).forEach(el=>el.addEventListener(“click”,()=>{const n=parseInt(el.dataset.it);set({itOpen:S.itOpen===n?null:n});}));
// Tips
document.querySelectorAll(”[data-tip]”).forEach(el=>el.addEventListener(“click”,()=>{const i=parseInt(el.dataset.tip);set({tipOpen:S.tipOpen===i?null:i});}));

// Exam
document.getElementById(“exNotes”)?.addEventListener(“click”,()=>set({exTab:“notes”}));
document.getElementById(“exTCA”)?.addEventListener(“click”,()=>set({exTab:“tca”,tcaOpen:null}));
document.getElementById(“exQuiz”)?.addEventListener(“click”,()=>set({exTab:“quiz”}));
document.querySelectorAll(”[data-tca]”).forEach(el=>el.addEventListener(“click”,()=>{const i=parseInt(el.dataset.tca);set({tcaOpen:S.tcaOpen===i?null:i});}));
document.querySelectorAll(”.ex-opt”).forEach(btn=>btn.addEventListener(“click”,()=>{
if(S.exAns!==null)return;
const i=parseInt(btn.dataset.ei);
const ok=i===HEM_QUESTIONS[S.exIdx].correct;
if(ok)addXP(5);
set({exAns:i,exScore:ok?S.exScore+1:S.exScore});
}));
document.getElementById(“exNext”)?.addEventListener(“click”,()=>{
if(S.exIdx+1>=HEM_QUESTIONS.length){addXP(20);set({exDone:true});}
else set({exIdx:S.exIdx+1,exAns:null});
});
document.getElementById(“exPrev”)?.addEventListener(“click”,()=>{if(S.exIdx>0)set({exIdx:S.exIdx-1,exAns:null});});
document.getElementById(“exRetry”)?.addEventListener(“click”,()=>set({exIdx:0,exAns:null,exScore:0,exDone:false}));
}

function mkTermQ(){
const list=S.tFilter&&S.tFilter!==“All”?TERMS.filter(t=>t.category===S.tFilter):TERMS;
if(list.length<4)return;
const q=list[Math.floor(Math.random()*list.length)];
const wrong=TERMS.filter(t=>t.term!==q.term).sort(()=>Math.random()-0.5).slice(0,3);
const opts=[…wrong.map(t=>t.def),q.def].sort(()=>Math.random()-0.5);
S.tQ=q; S.tOpts=opts; S.tAns=null;
}

// ── INIT ──────────────────────────────────────────────────────────────────────
(async()=>{
draw();
try{
const raw=localStorage.getItem(“ma”);
if(raw){
const sess=JSON.parse(raw);
const p=await getProfile(sess.id,sess.tok);
S.user=sess; S.xp=p?.xp||0; S.done=p?.completed_scenarios||[];
set({page:“app”});
return;
}
}catch(_){}
draw();
})();
</script>
