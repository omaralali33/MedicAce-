m-card.flip{background:rgba(0,210,255,0.08);border-color:rgba(0,210,255,0.3);}.term-emoji-big{font-size:40px;margin-bottom:9px;}.term-word{font-family:'Oxanium',monospace;font-size:22px;font-weight:800;margin-bottom:4px;}.term-cat{font-size:9px;color:var(--accent);font-family:'Oxanium',monospace;letter-spacing:1.5px;text-transform:uppercase;}.term-def{font-size:14px;color:var(--text);line-height:1.6;margin-bottom:7px;}.tap-hint{font-size:10px;color:var(--muted);margin-top:7px;}.term-nav{display:flex;justify-content:space-between;align-items:center;margin-top:12px;}.term-btn{background:var(--surface2);border:1px solid rgba(255,255,255,0.1);color:var(--text);padding:8px 18px;border-radius:99px;font-family:'Oxanium',monospace;font-size:11px;font-weight:700;cursor:pointer;transition:all 0.2s;}.term-btn:hover{border-color:var(--accent);color:var(--accent);}.term-count{font-family:'Oxanium',monospace;color:var(--muted);font-size:12px;}.streak-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(255,165,2,0.15);border:1px solid rgba(255,165,2,0.3);padding:3px 10px;border-radius:99px;font-size:10px;font-weight:700;font-family:'Oxanium',monospace;color:var(--warning);}.vitals-table{display:flex;flex-direction:column;gap:9px;margin-top:16px;}.vital-row{background:var(--surface2);border-radius:11px;padding:12px 14px;border:1px solid rgba(255,255,255,0.06);display:grid;grid-template-columns:40px 1fr 1fr 1fr;gap:9px;align-items:center;}@media(max-width:600px){.vital-row{grid-template-columns:36px 1fr;}}.vital-row-icon{font-size:20px;}.vital-col-name{font-family:'Oxanium',monospace;font-weight:700;font-size:12px;}.vital-col-label{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px;}.vital-col-val{font-size:11px;}.vital-normal{color:var(--success);}.vital-low{color:#74b9ff;}.vital-high{color:var(--danger);}.protocol-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:16px;}@media(max-width:600px){.p (255,255,255,0.06);cursor:pointer;transition:all 0.25s;border-left:3px solid transparent;}.intub-step.open{border-left-color:var(--accent);background:rgba(0,210,255,0.05);}.intub-step:hover{border-color:rgba(255,255,255,0.15);}.intub-step-header{display:flex;align-items:center;gap:10px;}.intub-num{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Oxanium',monospace;font-weight:800;font-size:12px;flex-shrink:0;}.intub-icon{font-size:20px;}.intub-title{font-family:'Oxanium',monospace;font-size:13px;font-weight:700;flex:1;}.intub-chevron{color:var(--muted);font-size:12px;transition:transform 0.2s;}.intub-chevron.open{transform:rotate(90deg);}.intub-content{margin-top:10px;font-size:12px;line-height:1.7;color:var(--muted);padding-left:40px;}.da-cards{display:flex;flex-direction:column;gap:9px;margin-top:11px;}.da-card{background:var(--surface);border-radius:9px;padding:12px 14px;border:1px solid rgba(255,165,2,0.2);}.da-title{font-family:'Oxanium',monospace;font-size:12px;font-weight:700;color:var(--warning);margin-bottom:4px;}.da-detail{font-size:11px;color:var(--muted);line-height:1.6;}.home-hero{background:linear-gradient(135deg,#111827,#0d1525);border:1px solid rgba(0,210,255,0.2);border-radius:var(--radius);padding:26px;text-align:center;margin-bottom:20px;position:relative;overflow:hidden;}.home-hero::before{content:'🚑';position:absolute;font-size:160px;opacity:0.04;top:50%;left:50%;transform:translate(-50%,-50%);}.hero-title{font-family:'Oxanium',monospace;font-size:clamp(19px,5vw,28px);font-weight:800;line-height:1.2;margin-bottom:7px;}.hero-accent{color:var(--accent);}.hero-sub{color:var(--muted);font-size:13px;max-width:460px;margin:0 auto 16px;}.stats-row{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;}.stat-box{text-align:center;}.stat-num{font-family:'Oxanium',monospace;font-size:19px;font-weight:800;color:var(--accent);}.stat-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;}.badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px;}.badge{padding:4px 11px;border-radius:99px;font-size:10px;font-weight:700;font-family:'Oxanium',monospace;border:1px solid;opacity:0.3;}.badge.earned{opacity:1;}.back-btn{background:transparent;border:1px solid rgba(255,255,255,0.1);color:var(--muted);padding:6px 14px;border-radius:99px;cursor:pointer;font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;transition:all 0.2s;margin-bottom:13px;display:inline-flex;align-items:center;gap:5px;}.back-btn:hover{border-color:var(--accent);color:var(--accent);}.term-quiz-question{background:var(--surface2);border-radius:11px;padding:20px;text-align:center;margin-bottom:12px;border:1px solid rgba(255,255,255,0.06);}.watermark{text-align:center;padding:22px 0 8px;}.watermark-line{height:1px;background:linear-gradient(90deg,transparent,rgba(0,210,255,0.3),transparent);margin-bottom:14px;}.watermark-text{font-family:'Oxanium',monospace;font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;}.watermark-name{font-family:'Oxanium',monospace;font-size:18px;font-weight:800;background:linear-gradient(90deg,var(--accent),#a29bfe,#fd79a8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:4px;margin-top:5px;}.watermark-sub{font-size:10px;color:rgba(0,210,255,0.4);font-family:'Oxanium',monospace;letter-spacing:1.5px;margin-top:6px;}.watermark-badge{display:inline-block;border:1px solid rgba(0,210,255,0.2);border-radius:99px;padding:5px 18px;margin-top:9px;font-size:10px;color:rgba(0,210,255,0.5);font-family:'Oxanium',monospace;letter-spacing:1px;}</style>

<script>
const MODULES = [
  { id: "scenarios",    icon: "🚑", label: "Live Scenarios",    color: "#ff4757", desc: "Real-world emergency calls" },
  { id: "terminology",  icon: "📖", label: "Med Terminology",   color: "#ffa502", desc: "Master the language of medicine" },
  { id: "vitals",       icon: "❤️", label: "Vitals Check",      color: "#2ed573", desc: "Normal vs danger ranges" },
  { id: "protocols",    icon: "📋", label: "Protocols",         color: "#1e90ff", desc: "Step-by-step treatment guides" },
  { id: "pharmacology", icon: "💊", label: "Pharmacology",      color: "#a29bfe", desc: "Drugs, doses & indications" },
  { id: "intubation",   icon: "🫁", label: "Intubation",        color: "#00cec9", desc: "Airway management mastery" },
  { id: "anatomy",      icon: "🫀", label: "Anatomy",           color: "#fd79a8", desc: "Body systems flashcards" },
  { id: "quicktips",   icon: "📝", label: "Quick Tips",        color: "#f9ca24", desc: "EMS daily tips & notes" },
  { id: "exams",       icon: "🎓", label: "Exam Prep",         color: "#a8e063", desc: "HEM 3106 practice exams" },
];

const SCENARIOS = [
{
id:1,title:“Chest Pain - STEMI”,emoji:“💔”,difficulty:“Easy”,xp:50,
age:58,gender:“Male”,chief:“Crushing chest pain radiating to left arm, onset 20 min ago”,
vitals:{bp:“160/95”,hr:“102”,rr:“22”,spo2:“94%”,temp:“37.1°C”,gcs:“15”},
history:“HTN, Hyperlipidemia, smoker 30 years. Takes lisinopril & atorvastatin.”,
steps:[
{q:“What is your FIRST priority on scene?”,options:[“Check scene safety”,“Start IV line”,“Give aspirin”,“Call for backup”],correct:0,explain:“Scene safety ALWAYS comes first - never approach until the scene is confirmed safe for you and your crew.”},
{q:“Best assessment tool for this presentation?”,options:[“SAMPLE history”,“AVPU scale”,“Cincinnati Stroke Scale”,“START triage”],correct:0,explain:“SAMPLE (Signs, Allergies, Medications, Pertinent history, Last meal, Events) is ideal for medical emergencies.”},
{q:“What medication do you give FIRST?”,options:[“Nitroglycerin”,“Aspirin 324mg chewed”,“Morphine IV”,“Oxygen by NRB mask”],correct:1,explain:“Aspirin 324mg chewed is first-line for suspected ACS - irreversibly inhibits platelet aggregation immediately.”},
{q:“SpO2 is 94%. Which oxygen delivery device?”,options:[“Nasal cannula 2L/min”,“Simple face mask 6L/min”,“Non-rebreather mask 15L/min”,“No oxygen needed”],correct:2,explain:“SpO2 < 95% with respiratory distress = high-flow O2 via NRB mask at 15L/min.”},
{q:“Which ECG finding would MOST concern you?”,options:[“Sinus tachycardia”,“ST elevation in II, III, aVF”,“PACs”,“Sinus bradycardia”],correct:1,explain:“ST elevation in II, III, aVF = inferior STEMI - time-critical, requires immediate cath lab activation.”},
],
},
{
id:2,title:“Pediatric Seizure”,emoji:“⚡”,difficulty:“Medium”,xp:80,
age:4,gender:“Female”,chief:“Child seizing 5 minutes, now post-ictal”,
vitals:{bp:“90/60”,hr:“140”,rr:“28”,spo2:“96%”,temp:“39.2°C”,gcs:“10”},
history:“No prior seizures. No medications. Fever since yesterday.”,
steps:[
{q:“Most likely seizure type given age + fever?”,options:[“Epileptic seizure”,“Febrile seizure”,“Psychogenic seizure”,“Hypoglycemic seizure”],correct:1,explain:“Febrile seizures are common in children 6mo-6yrs. High fever lowers seizure threshold in susceptible kids.”},
{q:“FIRST intervention?”,options:[“Give diazepam”,“Ensure airway & oxygenation”,“Start IV access”,“Check blood glucose”],correct:1,explain:“Airway ALWAYS first. Post-ictal patients have compromised tone - reposition and suction as needed.”},
{q:“Blood glucose: 3.1 mmol/L. What now?”,options:[“Recheck in 5 min”,“Oral glucose gel”,“IV dextrose 25%”,“Withhold treatment”],correct:2,explain:“BGL < 4 mmol/L in seizing child = IV dextrose immediately. Oral route is unsafe with altered LOC.”},
{q:“How do you calculate pediatric drug doses?”,options:[“Adult dose x 0.5”,“Weight (kg) x dose/kg”,“Age-based chart only”,“Estimate by size”],correct:1,explain:“Pediatric dosing is ALWAYS weight-based (mg/kg). Use Broselow tape or actual scale weight.”},
{q:“Child seizes again. No IV. Fastest benzo route?”,options:[“Oral midazolam”,“IM midazolam”,“Rectal diazepam”,“Intranasal midazolam”],correct:3,explain:“Intranasal midazolam absorbs as rapidly as IV and is the preferred route when no IV access exists.”},
],
},
{
id:3,title:“Trauma - MVA”,emoji:“🚗”,difficulty:“Hard”,xp:120,
age:24,gender:“Male”,chief:“Unrestrained driver, high-speed collision, unresponsive”,
vitals:{bp:“88/60”,hr:“128”,rr:“30”,spo2:“90%”,temp:“36.8°C”,gcs:“8”},
history:“Unknown. Scene: severe front-end damage, airbag deployed.”,
steps:[
{q:“GCS is 8 - what does this indicate?”,options:[“Minor head injury”,“Severe - consider definitive airway (RSI)”,“Surgery only”,“Normal for trauma”],correct:1,explain:“GCS <= 8 = severe injury, airway at risk. Prepare for RSI and definitive airway management.”},
{q:“BP 88/60, HR 128 in trauma = ?”,options:[“Neurogenic shock”,“Class III Hemorrhagic Shock”,“Anaphylactic shock”,“Septic shock”],correct:1,explain:“Hypotension + tachycardia + trauma = hemorrhagic shock Class III (30-40% blood volume lost).”},

function renderExams() {
const tabs = [[“quiz”,“Quiz”],[“study”,“Study Cards”],[“tca”,“TCA Module”]];
let content = “”;

if (S.examTab === “quiz”) {
if (S.examDone) {
const pct = Math.round((S.examScore / HEM_QUESTIONS.length) * 100);
content = ` <div style="text-align:center;padding:20px 0"> <div style="font-size:48px;margin-bottom:12px">${pct>=80?"🏆":pct>=60?"👍":"📚"}</div> <div style="font-family:'Oxanium',monospace;font-size:28px;font-weight:800;color:var(--ac)">${pct}%</div> <div class="muted">${S.examScore} / ${HEM_QUESTIONS.length} correct</div> <button class="btn" style="margin-top:16px" id="exam-restart">Try Again</button> </div>`;
} else {
const q = HEM_QUESTIONS[S.examIdx];
content = `<div class="pb" style="margin-bottom:12px"><div class="pf" style="width:${(S.examIdx/HEM_QUESTIONS.length)*100}%"></div></div> <div class="muted" style="margin-bottom:10px">Q${S.examIdx+1} of ${HEM_QUESTIONS.length} · Score: ${S.examScore}</div> <div class="card" style="margin-bottom:14px;background:var(--s2)"> <div style="font-size:13px;line-height:1.7">${q.question}</div> </div> ${q.options.map((o, i) => { let cls = "ob"; if (S.examAnswered) { if (i === q.correct) cls += " ok"; else if (i === S.examSelectedOpt) cls += " er"; } return`<button class=”${cls}” ${S.examAnswered?“disabled”:””} data-examopt=”${i}”>
<span class="ol">${[“A”,“B”,“C”,“D”][i]}</span>${o}
</button>`; }).join("")} ${S.examAnswered ? `
<div class="expl"><strong>${S.examCorrect?“✅ Correct!”:“❌ Wrong”}</strong> ${q.explanation||””}</div>
<button class="btn" id="exam-next">${S.examIdx < HEM_QUESTIONS.length-1 ? “Next →” : “Finish (+20 XP)”}</button>
` : ""}`;
}
} else if (S.examTab === “study”) {
const cards = HEM_STUDY || [];
content = cards.map(c => ` <div class="card" style="margin-bottom:10px"> <div style="font-family:'Oxanium',monospace;font-weight:700;font-size:13px;color:var(--ac);margin-bottom:6px">${c.topic}</div> <div style="font-size:12px;line-height:1.7">${c.content}</div> </div>`).join(””);
} else {
content = `<div class="card" style="background:var(--s2);margin-bottom:14px"> <div style="font-family:'Oxanium',monospace;font-weight:800;font-size:15px;color:var(--ac);margin-bottom:6px">🚨 Traumatic Cardiac Arrest</div> <div class="muted">H.O.T. Approach — 10-Step Protocol</div> </div> ${(TCA_STEPS||[]).map((s, i) =>`
<div style="display:flex;gap:11px;margin-bottom:10px;align-items:flex-start">
<div style="min-width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--ac),#0066ff);color:#000;display:flex;align-items:center;justify-content:center;font-family:'Oxanium',monospace;font-weight:800;font-size:11px;flex-shrink:0">${i+1}</div>
<div class="card" style="flex:1;cursor:default">
<div style="font-family:'Oxanium',monospace;font-weight:700;font-size:12px;margin-bottom:3px">${s.step||s.title||s}</div>

return `<div class="panel"> <div class="ptitle">📝 Exam Prep — HEM 3106</div> <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap"> ${tabs.map(([t,l]) => `<button class=“tab${S.examTab===t?” on”:””}” data-examtab=”${t}”>${l}</button>`).join(””)}

  </div>`;
}

function bindEvents() {
document.querySelectorAll(”[data-authtab]”).forEach(el =>
el.addEventListener(“click”, () => set({authTab: el.dataset.authtab, authErr: “”})));

[“ai-email”,“ai-pass”,“ai-name”].forEach(id => {
const el = document.getElementById(id);
if (el) el.addEventListener(“input”, e => {
if (id===“ai-email”) S.authEmail = e.target.value;
if (id===“ai-pass”) S.authPass = e.target.value;
if (id===“ai-name”) S.authName = e.target.value;
});
});

const authBtn = document.getElementById(“auth-submit”);
if (authBtn) authBtn.addEventListener(“click”, handleAuth);

document.querySelectorAll(”[data-page]”).forEach(el =>
el.addEventListener(“click”, () => set({page: el.dataset.page})));

const ava = document.getElementById(“avatar-btn”);
if (ava) ava.addEventListener(“click”, handleLogout);

document.querySelectorAll(”[data-scstart]”).forEach(el =>
el.addEventListener(“click”, () => set({scIdx: +el.dataset.scstart, scStep: 0, scAnswered: false, scSelectedOpt: null})));

const scBack = document.getElementById(“sc-back”);
if (scBack) scBack.addEventListener(“click”, () => set({scIdx: null}));

document.querySelectorAll(”[data-scopt]”).forEach(el =>
el.addEventListener(“click”, () => {
if (S.scAnswered) return;
const i = +el.dataset.scopt;
const correct = SCENARIOS[S.scIdx].steps[S.scStep].correct;
const isOk = i === correct;
if (isOk) addXP(10);
set({scAnswered: true, scCorrect: isOk, scSelectedOpt: i});
}));

const scNext = document.getElementById(“sc-next”);
if (scNext) scNext.addEventListener(“click”, () =>
set({scStep: S.scStep+1, scAnswered: false, scSelectedOpt: null}));

const scDone = document.getElementById(“sc-done”);
if (scDone) scDone.addEventListener(“click”, () => {
addXP(30);
set({scIdx: null});
});

document.querySelectorAll(”[data-termtab]”).forEach(el =>
el.addEventListener(“click”, () => set({termTab: el.dataset.termtab})));

const fc = document.getElementById(“flash-card”);
if (fc) fc.addEventListener(“click”, () => set({termFlipped: !S.termFlipped}));

const termFlip = document.getElementById(“term-flip”);
if (termFlip) termFlip.addEventListener(“click”, () => set({termFlipped: !S.termFlipped}));

const termPrev = document.getElementById(“term-prev”);
if (termPrev) termPrev.addEventListener(“click”, () =>
set({termIdx: (S.termIdx - 1 + TERMS.length) % TERMS.length, termFlipped: false}));

const termNext = document.getElementById(“term-next”);
if (termNext) termNext.addEventListener(“click”, () =>
set({termIdx: (S.termIdx + 1) % TERMS.length, termFlipped: false}));

const tqs = document.getElementById(“term-quiz-start”);
if (tqs) tqs.addEventListener(“click”, () => {
const q = TERMS[Math.floor(Math.random() * TERMS.length)];
const wrong = TERMS.filter(t => t.term !== q.term).sort(() => 0.5-Math.random()).slice(0,3);
S.termQ = q;
S.termOpts = […wrong.map(t=>t.def), q.def].sort(()=>0.5-Math.random());
S.termAns = null;
S.termSelectedOpt = null;
render();
});

document.querySelectorAll(”[data-termopt]”).forEach(el =>
el.addEventListener(“click”, () => {
if (S.termAns !== null) return;
const ans = el.dataset.termval;
const isOk = ans === S.termQ.def;
if (isOk) { S.termScore++; addXP(5); }
S.termTotal++;
S.termAns = ans;
render();
}));

const tnq = document.getElementById(“term-next-q”);
if (tnq) tnq.addEventListener(“click”, () => {
const q = TERMS[Math.floor(Math.random() * TERMS.length)];
const wrong = TERMS.filter(t => t.term !== q.term).sort(() => 0.5-Math.random()).slice(0,3);
S.termQ = q;
S.termOpts = […wrong.map(t=>t.def), q.def].sort(()=>0.5-Math.random());
S.termAns = null;
render();
});

document.querySelectorAll(”[data-protoopen]”).forEach(el =>
el.addEventListener(“click”, () => {
const i = +el.dataset.protoopen;
set({protoOpen: S.protoOpen === i ? null : i});
}));

document.querySelectorAll(”[data-drugopen]”).forEach(el =>
el.addEventListener(“click”, () => {
const i = +el.dataset.drugopen;
set({drugOpen: S.drugOpen === i ? null : i});
}));

document.querySelectorAll(”[data-tipopen]”).forEach(el =>
el.addEventListener(“click”, () => {
const i = +el.dataset.tipopen;
set({tipOpen: S.tipOpen === i ? null : i});
}));

document.querySelectorAll(”[data-examtab]”).forEach(el =>
el.addEventListener(“click”, () => set({examTab: el.dataset.examtab})));

document.querySelectorAll(”[data-examopt]”).forEach(el =>
el.addEventListener(“click”, () => {
if (S.examAnswered) return;
const i = +el.dataset.examopt;
const q = HEM_QUESTIONS[S.examIdx];
const isOk = i === q.correct;
if (isOk) { S.examScore++; addXP(5); }
set({examAnswered: true, examCorrect: isOk, examSelectedOpt: i});
}));

const examNext = document.getElementById(“exam-next”);
if (examNext) examNext.addEventListener(“click”, () => {
const nextIdx = S.examIdx + 1;
if (nextIdx >= HEM_QUESTIONS.length) {
addXP(20);
set({examDone: true, examAnswered: false});
} else {
set({examIdx: nextIdx, examAnswered: false, examSelectedOpt: null});
}
});

const examRestart = document.getElementById(“exam-restart”);
if (examRestart) examRestart.addEventListener(“click”, () =>
set({examIdx: 0, examScore: 0, examDone: false, examAnswered: false, examSelectedOpt: null}));
}

async function handleAuth() {
S.authLoading = true; S.authErr = “”; render();
try {
if (S.authTab === “login”) {
const d = await signIn(S.authEmail, S.authPass);
if (d.error) { set({authErr: d.error.message||“Login failed”, authLoading: false}); return; }
const profile = await loadProfile(d.user.id);
const sess = {id: d.user.id, email: d.user.email, accessToken: d.access_token,
name: profile?.name || d.user.email.split(”@”)[0],
avatarColor: profile?.avatar_color || COLORS[Math.floor(Math.random()*COLORS.length)]
};
localStorage.setItem(“ma_sess”, JSON.stringify(sess));
set({loggedIn:true, userId:sess.id, token:sess.accessToken, name:sess.name,
email:sess.email, avatarColor:sess.avatarColor,
xp: profile?.xp||0, badges: profile?.badges||[], authLoading:false});
} else {
const d = await signUp(S.authEmail, S.authPass, S.authName);
if (d.error) { set({authErr: d.error.message||“Sign up failed”, authLoading: false}); return; }
const color = COLORS[Math.floor(Math.random()*COLORS.length)];
await upsertProfile(d.user.id, {name:S.authName, avatar_color:color, xp:0, badges:[]});
const sess = {id:d.user.id, email:d.user.email, accessToken:d.access_token,
name:S.authName||d.user.email.split(”@”)[0], avatarColor:color};
localStorage.setItem(“ma_sess”, JSON.stringify(sess));
set({loggedIn:true, userId:sess.id, token:sess.accessToken, name:sess.name,
email:sess.email, avatarColor:color, xp:0, badges:[], authLoading:false});
}
} catch(e) {
set({authErr: “Network error. Try again.”, authLoading: false});
}
}

function handleLogout() {
if (!confirm(“Sign out?”)) return;
localStorage.removeItem(“ma_sess”);
set({loggedIn:false, userId:null, token:null, name:””, email:””, xp:0, badges:[]});
}

(async function init() {
try {
const raw = localStorage.getItem(“ma_sess”);
if (raw) {
const sess = JSON.parse(raw);
const profile = await loadProfile(sess.id);
set({loggedIn:true, userId:sess.id, token:sess.accessToken,
name:sess.name, email:sess.email, avatarColor:sess.avatarColor||”#00d2ff”,
xp:profile?.xp||0, badges:profile?.badges||[]});
return;
}
} catch(e) {}
render();
})();
</script>
